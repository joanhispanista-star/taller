<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1e24">
  <title>Taller de Pintura · Garaje</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina-garaje">
  <header class="barra">
    <div class="marca-app">Taller de Pintura</div>
    <span class="subtitulo">Garaje</span>
  </header>

  <!-- Las secciones de la app. El Garaje es esta página; las otras tres
       viven en tablero.html y se abren en la pestaña pedida. -->
  <nav class="pestanas" aria-label="Secciones">
    <a href="garaje.html" aria-current="page">Garaje</a>
    <a href="tablero.html?p=empleados">Empleados</a>
    <a href="tablero.html?p=historial">Historial</a>
    <a href="tablero.html?p=indicadores">Indicadores</a>
  </nav>

  <main class="garaje">
    <!-- La puerta grande: una foto del carro y la app propone qué carro es,
         de qué color y qué carrocería; la persona confirma. -->
    <div class="acciones-garaje">
      <button type="button" id="nuevo-con-foto" class="primario">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path fill="currentColor" d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9zm3 5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>
        Nuevo carro con foto
      </button>
    </div>
    <input id="foto-carro" type="file" accept="image/*" capture="environment" hidden>

    <!-- Sin `required`: el aviso del navegador tapa el campo en el celular;
         el código enfoca la placa si falta. -->
    <form id="registro" class="registro" autocomplete="off">
      <label class="campo">
        <span>O por placa</span>
        <input id="placa" type="text" inputmode="text" autocapitalize="characters" placeholder="ABC123">
      </label>
      <label class="campo">
        <span>Marca</span>
        <input id="marca" type="text" maxlength="40" placeholder="Chevrolet Onix">
      </label>
      <button type="submit" class="primario">Abrir</button>
    </form>
    <p class="ayuda">Si la placa ya está en el Garaje se abre ese carro; si no, se crea.</p>
    <p id="aviso" class="aviso" hidden></p>
    <p id="borrador" class="borrador" hidden><span></span> <a href="index.html">Abrirlo</a></p>
    <p id="vacio" class="vacio" hidden>Todavía no hay carros. Tómale una foto al primero.</p>
    <ul id="carros" class="carros"></ul>

    <!-- La demostración: carros de varias marcas y colores, con piezas
         arregladas y en reparación, para ver la app con algo adentro. Se
         dice que es demostración y se quita en bloque. -->
    <div id="demo" class="demo" hidden>
      <p class="ayuda" id="demo-texto"></p>
      <button type="button" id="demo-boton"></button>
    </div>
  </main>

  <!-- La ficha del carro nuevo: la foto, lo que la app propone y lo que la
       persona confirma. Es un diálogo para que en el celular ocupe la
       pantalla y nada más se mueva debajo. -->
  <dialog id="ficha-nueva" class="ficha-nueva" aria-label="Carro nuevo">
    <img id="ficha-foto" alt="">
    <div class="ficha-cuerpo">
      <div class="progreso" aria-hidden="true"><b id="ficha-progreso"></b></div>
      <p id="ficha-estado" class="aviso" hidden></p>
      <div class="ficha-campos">
        <label class="campo">
          <span>Placa</span>
          <input id="ficha-placa" type="text" inputmode="text" autocapitalize="characters" placeholder="ABC123" autocomplete="off">
        </label>
        <label class="campo campo-color">
          <span>Color (de la foto)</span>
          <span class="color-elegido"><input id="ficha-color" type="color" value="#cfd4da"><b id="ficha-color-nombre">plateado</b></span>
        </label>
      </div>
      <p class="ayuda" id="ficha-ayuda">La app propone; tú confirmas con un toque.</p>
      <div id="ficha-sugerencias" class="sugerencias" aria-label="Carros parecidos"></div>
      <label class="campo">
        <span>Marca y línea</span>
        <input id="ficha-linea" type="text" list="lineas-catalogo" placeholder="Chevrolet Onix" autocomplete="off">
      </label>
      <datalist id="lineas-catalogo"></datalist>
      <label class="campo">
        <span>Versión (puestos, año, lo que la distinga)</span>
        <input id="ficha-version" type="text" maxlength="40" autocomplete="off" placeholder="5 puestos, 2023">
      </label>
      <div id="ficha-carrocerias" class="carrocerias" aria-label="Carrocería"></div>
      <div class="acciones">
        <button type="button" data-accion="cancelar">Cancelar</button>
        <button type="button" data-accion="abrir" class="primario">Abrir en 3D</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="js/garaje-pantalla.js"></script>
</body>
</html>
