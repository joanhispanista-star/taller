<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1e24">
  <title>Taller de Pintura · Visor</title>
  <link rel="stylesheet" href="css/estilos.css">
  <!-- Three.js vive en la carpeta (js/vendor): la app no depende de internet
       para dibujar el carro, y la versión no cambia sola. -->
  <script type="importmap">
    { "imports": { "three": "./js/vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <header class="barra">
    <!-- El nombre de la app cede su sitio al camino de vuelta: en 360 px no
         caben los dos y el Garaje es la pantalla de entrada. -->
    <a class="marca-app" href="garaje.html">‹ Garaje</a>
    <label class="campo">
      <span>Placa</span>
      <!-- Sin maxlength: una placa pegada como "ABC-123" se cortaría a
           "ABC-12" antes de limpiarla. La limpieza (6 caracteres) la hace
           el código al salir del campo. -->
      <input id="placa" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" placeholder="ABC123">
    </label>
    <label class="campo">
      <span>Marca</span>
      <input id="marca" type="text" autocomplete="off" maxlength="40" placeholder="Chevrolet Onix">
    </label>
  </header>

  <main id="escena">
    <canvas id="lienzo" aria-label="Carro en 3D. Arrastra para girarlo y toca una pieza para marcarla."></canvas>
    <div id="pista" class="pista">Arrastra para girar · toca una pieza para marcarla</div>
    <!-- Qué carro es y que el 3D es una carrocería de referencia, no el exacto. -->
    <div id="ficha" class="ficha" hidden></div>
    <nav class="vistas" aria-label="Vistas del carro">
      <button type="button" data-vista="frente">Frente</button>
      <button type="button" data-vista="izquierdo">Izquierdo</button>
      <button type="button" data-vista="derecho">Derecho</button>
      <button type="button" data-vista="atras">Atrás</button>
      <button type="button" data-vista="arriba">Arriba</button>
    </nav>
    <div id="error" class="error" hidden></div>
  </main>

  <section class="hoja" aria-live="polite">
    <p id="contador">Toca las piezas que necesitan pintura.</p>
    <ul id="lista"></ul>
    <div id="fotos" class="fotos" hidden></div>
    <p id="aviso" class="aviso" hidden></p>
    <div class="acciones">
      <button type="button" id="limpiar" disabled>Limpiar</button>
      <button type="button" id="enviar" class="primario" disabled>Enviar al asistente</button>
    </div>
  </section>

  <!-- El menú de estado de una pieza; hoja.js lo llena y lo coloca sobre el chip. -->
  <div id="menu-estado" class="menu-estado" role="menu" aria-label="Estado de la pieza" hidden></div>

  <!-- Una sola cámara para todos los chips: hoja.js apunta data-pieza antes
       de abrirla. `capture` abre la cámara directa en el celular; en el
       computador abre el selector de archivos, que para probar sirve igual. -->
  <input id="camara" type="file" accept="image/*" capture="environment" hidden>

  <dialog id="foto-grande" class="foto-grande" aria-label="Foto de la pieza">
    <img alt="">
    <p></p>
    <div class="acciones">
      <button type="button" data-accion="borrar">Borrar foto</button>
      <button type="button" data-accion="cerrar" class="primario">Cerrar</button>
    </div>
  </dialog>

  <script type="module" src="js/visor.js"></script>
</body>
</html>
